<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Jaydeep Verma Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    .auth-wrapper{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--bg)}
    .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:3rem;width:100%;max-width:440px;backdrop-filter:blur(12px)}
    .auth-logo{font-family:var(--font-heading);font-size:3rem;color:var(--accent);text-align:center;margin-bottom:0.5rem;letter-spacing:0.1em}
    .auth-subtitle{text-align:center;color:var(--muted);margin-bottom:2rem;font-size:0.9rem}
    .auth-card .form-group{margin-bottom:1.2rem}
    .auth-card .btn-primary{width:100%;padding:1rem;font-size:1rem;margin-top:0.5rem;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;border-radius:50px;background:var(--accent-gradient);color:#fff;font-weight:600;}
    .auth-card .btn-primary:hover{box-shadow:var(--accent-glow);}
    .auth-link{text-align:center;margin-top:1.5rem;color:var(--muted);font-size:0.9rem}
    .auth-link a{color:var(--accent);text-decoration:none}
    .auth-link a:hover{text-decoration:underline}
    .auth-error{background:rgba(255,77,77,0.1);border:1px solid rgba(255,77,77,0.3);color:#ff6b6b;padding:0.8rem 1rem;border-radius:10px;margin-bottom:1.5rem;font-size:0.85rem;text-align:center;display:none;}
  </style>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">JV.</div>
    <p class="auth-subtitle">Create your admin account</p>
    
    <div id="auth-error" class="auth-error"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Min 6 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required minlength="6">
      </div>
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
    <div class="auth-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
    <div class="auth-link">
      <a href="index.html">&#8592; Back to Portfolio</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('register-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const p1 = document.getElementById('password').value;
    const p2 = document.getElementById('confirmPassword').value;
    const errEl = document.getElementById('auth-error');

    if (p1 !== p2) {
      errEl.textContent = 'Passwords do not match.';
      errEl.style.display = 'block';
      return;
    }

    const user = document.getElementById('username').value.trim();
    localStorage.setItem('jv_admin_user', user || 'jaydeep');
    window.location.href = 'login.html?registered=true';
  });
</script>
</body>
</html>
